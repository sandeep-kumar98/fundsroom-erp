$kind: http-request
name: Create Customer
method: POST
url: '{{baseUrl}}/api/customers'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Rajesh Kumar",
      "mobile": "9876543210",
      "email": "rajesh@example.com",
      "businessName": "Kumar Enterprises",
      "gstNumber": "22AAAAA0000A1Z5",
      "customerType": "WHOLESALE",
      "address": "123 Main Street, Mumbai",
      "status": "ACTIVE",
      "followUpDate": "2025-02-01",
      "notes": "Interested in bulk orders"
    }
