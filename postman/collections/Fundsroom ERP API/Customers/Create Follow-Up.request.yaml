$kind: http-request
name: Create Follow-Up
method: POST
url: '{{baseUrl}}/api/customers/{{customerId}}/followups'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "note": "Called customer, interested in new product line",
      "followUpDate": "2025-02-15"
    }
