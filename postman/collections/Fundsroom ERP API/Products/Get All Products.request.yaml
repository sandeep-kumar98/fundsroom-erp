$kind: http-request
name: Get All Products
method: GET
url: '{{baseUrl}}/api/products'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: lowStock
    value: 'true'
    disabled: true
  - key: page
    value: '1'
    disabled: true
  - key: limit
    value: '10'
    disabled: true
